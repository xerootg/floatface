name: Wear Release

# Builds the Pixel Watch / Wear OS release APK and attaches it to a GitHub
# Release. Triggered by pushing a tag like `wear-v0.1.0`, or manually.
on:
  push:
    tags:
      - 'wear-v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name for the build (e.g. 0.1.0). Defaults to the app default.'
        required: false

permissions:
  contents: write   # create the release + upload the APK asset

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wear-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version name
        id: version
        run: |
          if [ -n "${{ github.event.inputs.versionName }}" ]; then
            echo "name=${{ github.event.inputs.versionName }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/wear-v* ]]; then
            echo "name=${GITHUB_REF_NAME#wear-v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      # Optional: bake the per-owner unlock bytes in from a secret so the
      # published APK is pre-provisioned. Omit the secret to ship an APK that is
      # configured entirely at runtime on the watch.
      - name: Provision unlock bytes (optional)
        if: ${{ secrets.UNLOCK_BYTES_HEX != '' }}
        run: echo "onewheel.unlockBytesHex=${{ secrets.UNLOCK_BYTES_HEX }}" > unlock.properties

      # Optional: decode a base64-encoded release keystore from a secret. Without
      # it the release APK is built unsigned (still a usable CI artifact).
      - name: Decode signing keystore (optional)
        id: keystore
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        env:
          FLOATFACE_VERSION_NAME: ${{ steps.version.outputs.name }}
          FLOATFACE_KEYSTORE: ${{ steps.keystore.outputs.path }}
          FLOATFACE_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          FLOATFACE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          FLOATFACE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: floatface-wear-release
          path: wear-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wear-app/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
